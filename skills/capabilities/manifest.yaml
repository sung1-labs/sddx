# Capability routing manifest for SDDx.
# The complete generated catalog is catalog.json. These are stable starting
# points used by workflow skills before domain-specific routing.
profiles:
  explore:
    primary:
      - grilling
      - continuous-discovery
      - research
    supporting:
      - system-design
      - domain-driven-design
      - design-everyday-things
  propose:
    primary:
      - system-design
      - codebase-design
      - domain-modeling
    supporting:
      - clean-architecture
      - to-spec
      - technical-documentation
  apply:
    primary:
      - implement
      - tdd
      - clean-code
    supporting:
      - refactoring-patterns
      - release-it
      - technical-documentation
  verify:
    primary:
      - code-review
      - tdd
      - improve-code-quality
    supporting:
      - architecture-optimization
      - release-it
      - ux-heuristics
  debug:
    primary:
      - diagnosing-bugs
      - triage
      - working-with-legacy-code
    supporting:
      - ddia-systems
      - high-perf-browser
      - tdd
  archive:
    primary:
      - handoff
      - technical-documentation
      - release-it
    supporting:
      - retro
      - to-tickets
      - sync-specs
router:
  name: sddx-capability-router
  stages: [explore, propose, apply, verify, debug, archive]
  automatic: true
  manual: true
