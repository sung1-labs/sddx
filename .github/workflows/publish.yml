name: Publish SDDx to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript
        run: npm run check

      - name: Rebuild capability catalog
        run: npm run catalog

      - name: Ensure generated files are committed
        run: git diff --exit-code -- skills/capabilities/catalog.json

      - name: Read package version
        id: package
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: published
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "@sung1-labs/sddx@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@sung1-labs/sddx@${PACKAGE_VERSION} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "@sung1-labs/sddx@${PACKAGE_VERSION} is not published; continuing."
          fi

      - name: Publish package with npm provenance
        if: steps.published.outputs.published != 'true'
        run: npm publish --access public --provenance
